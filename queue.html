<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #faf8f5;
–surface: #fff;
–text: #1c1a18;
–muted: #9a9490;
–border: #e0dbd4;
–accent: #7a5c3e;
}

body {
background: var(–bg);
color: var(–text);
font-family: ‘Jost’, sans-serif;
font-weight: 300;
min-height: 100vh;
padding: 48px 24px 80px;
}

.content { max-width: 580px; margin: 0 auto; }

.top-bar {
display: flex;
align-items: flex-end;
justify-content: space-between;
margin-bottom: 40px;
flex-wrap: wrap;
gap: 16px;
}

.title-block {}

.occasion {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 14px;
color: var(–muted);
margin-bottom: 4px;
}

h1 {
font-family: ‘Cormorant Garamond’, serif;
font-weight: 400;
font-size: 38px;
line-height: 1;
color: var(–text);
}

.controls {
display: flex;
gap: 10px;
align-items: center;
padding-bottom: 4px;
}

.count {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 14px;
color: var(–muted);
}

.btn {
background: none;
border: 1px solid var(–border);
color: var(–muted);
font-family: ‘Jost’, sans-serif;
font-weight: 300;
font-size: 11px;
letter-spacing: 0.12em;
text-transform: uppercase;
padding: 9px 16px;
cursor: pointer;
transition: all 0.15s;
border-radius: 1px;
}

.btn:hover { border-color: var(–accent); color: var(–accent); }
.btn-danger:hover { border-color: #c0392b; color: #c0392b; }

.divider {
width: 100%;
height: 1px;
background: var(–border);
margin-bottom: 0;
}

.col-heads {
display: grid;
grid-template-columns: 36px 1fr 1fr 64px;
gap: 16px;
padding: 12px 0;
border-bottom: 1px solid var(–border);
}

.col-heads span {
font-size: 10px;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
}

.queue-list { }

.row {
display: grid;
grid-template-columns: 36px 1fr 1fr 64px;
gap: 16px;
align-items: center;
padding: 14px 0;
border-bottom: 1px solid var(–border);
transition: opacity 0.2s;
}

.row.done { opacity: 0.3; }

.row-num {
font-family: ‘Cormorant Garamond’, serif;
font-size: 18px;
color: var(–muted);
}

.row.done .row-num { color: var(–accent); }

.artist {
font-family: ‘Cormorant Garamond’, serif;
font-size: 18px;
color: var(–text);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.song {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 16px;
color: var(–muted);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.row-btns {
display: flex;
gap: 10px;
justify-content: flex-end;
}

.icon-btn {
background: none;
border: none;
cursor: pointer;
font-size: 13px;
color: var(–border);
padding: 2px;
transition: color 0.15s;
line-height: 1;
}

.icon-btn:hover { color: var(–accent); }
.icon-btn.del:hover { color: #c0392b; }

.empty {
text-align: center;
padding: 80px 0;
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 18px;
color: var(–muted);
}

.refresh-hint {
margin-top: 28px;
font-size: 11px;
color: var(–border);
text-align: center;
letter-spacing: 0.1em;
font-style: italic;
font-family: ‘Cormorant Garamond’, serif;
}

@media (max-width: 480px) {
.col-heads { grid-template-columns: 32px 1fr 52px; }
.col-heads .h-song { display: none; }
.row { grid-template-columns: 32px 1fr 52px; }
.song { display: none; }
}
</style>

</head>
<body>
<div class="content">
  <div class="top-bar">
    <div class="title-block">
      <p class="occasion">♩ Song Requests</p>
      <h1>The Queue</h1>
    </div>
    <div class="controls">
      <span class="count" id="countText">0 requests</span>
      <button class="btn" onclick="seedTest()">+ Test entry</button>
      <button class="btn" onclick="loadRequests()">Refresh</button>
      <button class="btn btn-danger" onclick="clearAll()">Clear all</button>
    </div>
  </div>

  <div class="col-heads">
    <span>#</span>
    <span>Artist</span>
    <span class="h-song">Song</span>
    <span></span>
  </div>

  <div class="queue-list" id="queueList">
    <div class="empty">No requests yet.</div>
  </div>

  <p class="refresh-hint">Refreshes every 5 seconds</p>
</div>

<script>
  const STORAGE_KEY = 'party_requests_v1';
  let doneSet = new Set((JSON.parse(localStorage.getItem('done_requests') || '[]')).map(String));

  function saveDone() {
    localStorage.setItem('done_requests', JSON.stringify([...doneSet]));
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function loadRequests() {
    const requests = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const list = document.getElementById('queueList');
    const countEl = document.getElementById('countText');

    countEl.textContent = requests.length === 1 ? '1 request' : `${requests.length} requests`;

    if (requests.length === 0) {
      list.innerHTML = '<div class="empty">No requests yet.</div>';
      return;
    }

    list.innerHTML = requests.map((r, i) => {
      const done = doneSet.has(String(r.ts));
      return `
        <div class="row ${done ? 'done' : ''}">
          <div class="row-num">${i + 1}</div>
          <div class="artist">${esc(r.artist)}</div>
          <div class="song">${esc(r.song)}</div>
          <div class="row-btns">
            <button class="icon-btn" title="${done ? 'Undo' : 'Mark done'}" onclick="toggleDone(${r.ts})">${done ? '↩' : '✓'}</button>
            <button class="icon-btn del" title="Remove" onclick="removeRequest(${r.ts})">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleDone(ts) {
    const key = String(ts);
    doneSet.has(key) ? doneSet.delete(key) : doneSet.add(key);
    saveDone();
    loadRequests();
  }

  function removeRequest(ts) {
    let r = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(r.filter(x => x.ts !== ts)));
    doneSet.delete(String(ts));
    saveDone();
    loadRequests();
  }

  function clearAll() {
    if (!confirm('Clear all requests?')) return;
    localStorage.removeItem(STORAGE_KEY);
    doneSet.clear();
    saveDone();
    loadRequests();
  }

  function seedTest() {
    const r = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    r.push({ artist: 'Frank Sinatra', song: 'Fly Me to the Moon', ts: Date.now() });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(r));
    loadRequests();
  }

  loadRequests();
  setInterval(loadRequests, 5000);
</script>

</body>
</html>
