<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf8f5;
    --surface: #fff;
    --text: #1c1a18;
    --muted: #9a9490;
    --border: #e0dbd4;
    --accent: #7a5c3e;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }
  .content { max-width: 580px; margin: 0 auto; }
  .top-bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .occasion {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 38px;
    line-height: 1;
    color: var(--text);
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    padding-bottom: 4px;
    flex-wrap: wrap;
  }
  .count {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
  }
  .live-dot {
    display: inline-block;
    width: 7px; height: 7px;
    background: #4caf50;
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 9px 16px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 1px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger:hover { border-color: #c0392b; color: #c0392b; }
  .col-heads {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 64px;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .col-heads span {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 64px;
    gap: 16px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    transition: opacity 0.2s;
  }
  .row.done { opacity: 0.3; }
  .row-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--muted);
  }
  .row.done .row-num { color: var(--accent); }
  .artist {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-btns {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    color: var(--border);
    padding: 2px;
    transition: color 0.15s;
    line-height: 1;
  }
  .icon-btn:hover { color: var(--accent); }
  .icon-btn.del:hover { color: #c0392b; }
  .empty {
    text-align: center;
    padding: 80px 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--muted);
  }
  .status-bar {
    margin-top: 28px;
    font-size: 11px;
    color: var(--border);
    text-align: center;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
  }
  .config-banner {
    background: #fff8e1;
    border: 1px solid #ffe082;
    padding: 16px 20px;
    margin-bottom: 32px;
    border-radius: 2px;
    font-size: 12px;
    line-height: 1.7;
    color: #5a4a00;
    font-family: 'Jost', sans-serif;
  }
  .config-banner code {
    background: #fff3cd;
    padding: 1px 5px;
    font-family: monospace;
    font-size: 11px;
    border-radius: 2px;
  }
  @media (max-width: 480px) {
    .col-heads { grid-template-columns: 32px 1fr 52px; }
    .col-heads .h-song { display: none; }
    .row { grid-template-columns: 32px 1fr 52px; }
    .song { display: none; }
  }
</style>
</head>
<body>
<div class="content">

  <div class="config-banner" id="configBanner">
    <strong>⚙ Setup reminder</strong> — paste the same <code>FIREBASE_CONFIG</code> values here as in <code>request.html</code>
  </div>

  <div class="top-bar">
    <div>
      <p class="occasion">♩ Song Requests</p>
      <h1>The Queue</h1>
    </div>
    <div class="controls">
      <span class="count"><span class="live-dot"></span><span id="countText">Live</span></span>
      <button class="btn btn-danger" onclick="clearAll()">Clear all</button>
    </div>
  </div>

  <div class="col-heads">
    <span>#</span>
    <span>Artist</span>
    <span class="h-song">Song</span>
    <span></span>
  </div>

  <div id="queueList">
    <div class="empty">Waiting for requests…</div>
  </div>

  <p class="status-bar" id="statusBar">Connecting…</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, getDocs, writeBatch, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyD_USJ_3gpIaQVi25kjeXeVW-U7PJUnBkg",
    authDomain: "name-af162.firebaseapp.com",
    projectId: "name-af162",
    storageBucket: "name-af162.firebasestorage.app",
    messagingSenderId: "52429198912",
    appId: "1:52429198912:web:1ccf4552755f1adacb71a5"
  };

  const configured = true;
  document.getElementById('configBanner').style.display = 'none';

  if (!configured) {
    document.getElementById('statusBar').textContent = 'Firebase not configured yet.';
  } else {
    const app = initializeApp(FIREBASE_CONFIG);
    const db  = getFirestore(app);
    const col = collection(db, 'requests');
    const q   = query(col, orderBy('ts', 'asc'));

    // Real-time listener
    onSnapshot(q, snapshot => {
      const docs = snapshot.docs;
      const list = document.getElementById('queueList');
      const countEl = document.getElementById('countText');
      const statusEl = document.getElementById('statusBar');

      countEl.textContent = docs.length === 1 ? '1 request' : `${docs.length} requests`;
      statusEl.textContent = 'Live — updates automatically';

      if (docs.length === 0) {
        list.innerHTML = '<div class="empty">No requests yet.</div>';
        return;
      }

      list.innerHTML = docs.map((d, i) => {
        const r = d.data();
        const done = r.done || false;
        return `
          <div class="row ${done ? 'done' : ''}">
            <div class="row-num">${i + 1}</div>
            <div class="artist">${esc(r.artist || '')}</div>
            <div class="song">${esc(r.song || '—')}</div>
            <div class="row-btns">
              <button class="icon-btn" title="${done ? 'Undo' : 'Mark done'}" onclick="toggleDone('${d.id}', ${done})">${done ? '↩' : '✓'}</button>
              <button class="icon-btn del" title="Remove" onclick="removeRequest('${d.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }, err => {
      console.error(err);
      document.getElementById('statusBar').textContent = 'Connection error — check console.';
    });

    window.toggleDone = async function(id, currentDone) {
      await updateDoc(doc(db, 'requests', id), { done: !currentDone });
    };

    window.removeRequest = async function(id) {
      await deleteDoc(doc(db, 'requests', id));
    };

    window.clearAll = async function() {
      if (!confirm('Clear all requests?')) return;
      const snap = await getDocs(col);
      const batch = writeBatch(db);
      snap.forEach(d => batch.delete(d.ref));
      await batch.commit();
    };
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>

</body>
</html>
