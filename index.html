<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Song</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #faf8f5;
–surface: #fff;
–text: #1c1a18;
–muted: #9a9490;
–border: #e0dbd4;
–accent: #7a5c3e;
}

body {
background: var(–bg);
color: var(–text);
font-family: ‘Jost’, sans-serif;
font-weight: 300;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px 24px;
}

.container { width: 100%; max-width: 400px; }

.header { text-align: center; margin-bottom: 48px; }

.occasion {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 15px;
color: var(–muted);
letter-spacing: 0.05em;
margin-bottom: 10px;
}

h1 {
font-family: ‘Cormorant Garamond’, serif;
font-weight: 400;
font-size: 42px;
line-height: 1.1;
color: var(–text);
}

.divider {
width: 32px;
height: 1px;
background: var(–accent);
margin: 18px auto 0;
opacity: 0.5;
}

.card {
background: var(–surface);
border: 1px solid var(–border);
padding: 36px 32px;
border-radius: 2px;
}

.field { margin-bottom: 24px; }

label {
display: block;
font-size: 11px;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 10px;
font-weight: 400;
}

input {
width: 100%;
background: transparent;
border: none;
border-bottom: 1px solid var(–border);
color: var(–text);
font-family: ‘Cormorant Garamond’, serif;
font-size: 20px;
padding: 6px 0 10px;
outline: none;
transition: border-color 0.2s;
border-radius: 0;
-webkit-appearance: none;
}

input:focus { border-bottom-color: var(–accent); }
input::placeholder { color: var(–border); font-style: italic; }

.submit-btn {
width: 100%;
margin-top: 8px;
background: var(–accent);
color: #fff;
border: none;
font-family: ‘Jost’, sans-serif;
font-weight: 300;
font-size: 13px;
letter-spacing: 0.18em;
text-transform: uppercase;
padding: 15px;
cursor: pointer;
transition: background 0.15s;
border-radius: 1px;
}

.submit-btn:hover { background: #6a4e35; }

.note {
text-align: center;
margin-top: 20px;
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 13px;
color: var(–muted);
}

.success { display: none; text-align: center; padding: 36px 0; }

.success-icon { font-size: 28px; margin-bottom: 14px; color: var(–accent); opacity: 0.6; }

.success h2 {
font-family: ‘Cormorant Garamond’, serif;
font-weight: 400;
font-size: 28px;
color: var(–text);
margin-bottom: 6px;
}

.success p {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 15px;
color: var(–muted);
margin-bottom: 24px;
}

.another-btn {
background: none;
border: 1px solid var(–border);
color: var(–muted);
font-family: ‘Jost’, sans-serif;
font-weight: 300;
font-size: 12px;
letter-spacing: 0.15em;
text-transform: uppercase;
padding: 12px 24px;
cursor: pointer;
transition: border-color 0.15s, color 0.15s;
}

.another-btn:hover { border-color: var(–accent); color: var(–accent); }
</style>

</head>
<body>
<div class="container">
  <div class="header">
    <p class="occasion">♩ Happy Birthday</p>
    <h1>Request a Song</h1>
    <div class="divider"></div>
  </div>

  <div class="card">
    <div id="formView">
      <div class="field">
        <label>Artist</label>
        <input type="text" id="artist" placeholder="Who do you want to hear?" autocomplete="off" />
      </div>
      <div class="field">
        <label>Song &nbsp;<span style="font-size:10px;opacity:0.5">optional</span></label>
        <input type="text" id="song" placeholder="Any song in particular?" autocomplete="off" />
      </div>
      <button class="submit-btn" onclick="submitRequest()">Send Request</button>
    </div>

```
<div class="success" id="successView">
  <div class="success-icon">♩</div>
  <h2>Request sent!</h2>
  <p>We'll do our best to fit it in.</p>
  <button class="another-btn" onclick="resetForm()">Add another</button>
</div>
```

  </div>

  <p class="note">Requests are not guaranteed.</p>
</div>

<script>
  const STORAGE_KEY = 'party_requests_v1';

  function submitRequest() {
    const artist = document.getElementById('artist').value.trim();
    const song = document.getElementById('song').value.trim();
    if (!artist) {
      const el = document.getElementById('artist');
      el.focus();
      el.style.borderBottomColor = '#c0392b';
      setTimeout(() => el.style.borderBottomColor = '', 1000);
      return;
    }
    const requests = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    requests.push({ artist, song: song || '—', ts: Date.now() });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
  }

  function resetForm() {
    document.getElementById('artist').value = '';
    document.getElementById('song').value = '';
    document.getElementById('successView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') submitRequest(); });
</script>

</body>
</html>
