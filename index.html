<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APUSH GRIND</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0a0f;
  --paper: #f5f0e8;
  --red: #c0392b;
  --gold: #d4a017;
  --dim: #1a1a2e;
  --muted: #4a4a6a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--paper);
  font-family: 'Space Mono', monospace;
  overflow-x: hidden;
  cursor: crosshair;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}

header {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  position: relative;
}

.main-title {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(80px, 18vw, 200px);
}

.red { color: var(--red); }
.gold { color: var(--gold); }

.subtitle {
  margin-top: 20px;
  color: var(--gold);
  letter-spacing: 0.2em;
}

.countdown {
  display: flex;
  gap: 20px;
  margin-top: 40px;
}

.cd-block {
  background: rgba(255,255,255,0.03);
  padding: 20px;
  border: 1px solid rgba(192,57,43,0.3);
}

.cd-num {
  font-size: 40px;
  font-family: 'Bebas Neue', cursive;
}

.periods-section {
  padding: 100px 20px;
  max-width: 1400px;
  margin: auto;
}

.section-header {
  font-size: 60px;
  font-family: 'Bebas Neue', cursive;
  margin-bottom: 40px;
}

.periods-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
  gap: 20px;
}

.period-card {
  background: var(--dim);
  padding: 30px;
  text-decoration: none;
  color: inherit;
  border: 1px solid rgba(255,255,255,0.05);
  transition: 0.25s;
  display: block;
}

.period-card:hover {
  transform: translateY(-6px);
  border-color: var(--red);
}

.period-num {
  font-size: 80px;
  opacity: 0.08;
  font-family: 'Bebas Neue', cursive;
}

.period-tag {
  color: var(--red);
  font-size: 12px;
}

.period-dates {
  color: var(--gold);
  font-size: 24px;
  font-family: 'Bebas Neue', cursive;
}

.period-name {
  font-size: 22px;
  margin: 10px 0;
  font-family: 'Bebas Neue', cursive;
}

.period-desc {
  font-size: 12px;
  line-height: 1.6;
  opacity: 0.8;
}

.period-pct {
  color: var(--red);
  display: block;
  margin-top: 12px;
}

.cursor-dot {
  position: fixed;
  width: 8px;
  height: 8px;
  background: var(--red);
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
}

@media(max-width:600px){
  .countdown {
    flex-wrap: wrap;
    justify-content: center;
  }
}
</style>
</head>

<body>

<div class="cursor-dot" id="cursorDot"></div>

<header>
  <div class="main-title">
    <span class="red">AP</span><span class="gold">USH</span>
  </div>

  <p class="subtitle">GRIND MODE</p>

  <div class="countdown">
    <div class="cd-block">
      <div class="cd-num" id="cd-days">--</div>
      <div>Days</div>
    </div>
    <div class="cd-block">
      <div class="cd-num" id="cd-hours">--</div>
      <div>Hours</div>
    </div>
    <div class="cd-block">
      <div class="cd-num" id="cd-mins">--</div>
      <div>Mins</div>
    </div>
    <div class="cd-block">
      <div class="cd-num" id="cd-secs">--</div>
      <div>Secs</div>
    </div>
  </div>
</header>

<section class="periods-section">
  <div class="section-header">THE <span class="red">9</span> PERIODS</div>
  <div class="periods-grid" id="periodsGrid"></div>
</section>

<script>
const dot = document.getElementById('cursorDot');

document.addEventListener('mousemove', e => {
  dot.style.left = e.clientX + 'px';
  dot.style.top = e.clientY + 'px';
});

function updateCountdown() {
  const exam = new Date('2026-05-08T08:00:00');
  const now = new Date();
  const diff = exam - now;

  if (diff <= 0) return;

  document.getElementById('cd-days').textContent =
    Math.floor(diff / 86400000);

  document.getElementById('cd-hours').textContent =
    Math.floor((diff % 86400000) / 3600000);

  document.getElementById('cd-mins').textContent =
    Math.floor((diff % 3600000) / 60000);

  document.getElementById('cd-secs').textContent =
    Math.floor((diff % 60000) / 1000);
}

setInterval(updateCountdown, 1000);
updateCountdown();

const periods = [
{num:1,dates:'1491–1607',name:'Before European Contact',pct:'~5%'},
{num:2,dates:'1607–1754',name:'Colonial America',pct:'~9%'},
{num:3,dates:'1754–1800',name:'Revolution & New Nation',pct:'~12%'},
{num:4,dates:'1800–1848',name:'Expansion & Reform',pct:'~10%'},
{num:5,dates:'1844–1877',name:'Civil War Era',pct:'~13%'},
{num:6,dates:'1865–1898',name:'Gilded Age',pct:'~13%'},
{num:7,dates:'1890–1945',name:'Progressive to WWII',pct:'~17%'},
{num:8,dates:'1945–1980',name:'Cold War America',pct:'~13%'},
{num:9,dates:'1980–Present',name:'Contemporary America',pct:'~8%'}
];

const spanishNums = [
'uno',
'dos',
'tres',
'cuatro',
'cinco',
'seis',
'siete',
'ocho',
'nueve'
];

const grid = document.getElementById('periodsGrid');

periods.forEach((p, i) => {
  const card = document.createElement('a');

  card.href = `period${spanishNums[i]}.html`;
  card.className = 'period-card';

  card.innerHTML = `
    <div class="period-num">${p.num}</div>
    <span class="period-tag">Period ${p.num}</span>
    <div class="period-dates">${p.dates}</div>
    <div class="period-name">${p.name}</div>
    <span class="period-pct">Exam Weight: ${p.pct}</span>
  `;

  grid.appendChild(card);
});
</script>

</body>
</html>
